# Minimal tmux: mouse, true colour, 1-based indexes, vim keys between panes.
# No theme, no TPM (decision 2026-09-07). The only plugins are resurrect +
# continuum, pinned archives from .chezmoiexternal.toml (2026-10-22).
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g set-clipboard on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# VS Code / Claude Code IDE link: refresh these on every attach, since the
# extension's port changes whenever VS Code restarts (2026-10-13)
set -ga update-environment CLAUDE_CODE_SSE_PORT
set -ga update-environment TERM_PROGRAM
set -ga update-environment TERM_PROGRAM_VERSION
set -ga update-environment VSCODE_GIT_IPC_HANDLE
set -ga update-environment VSCODE_GIT_ASKPASS_MAIN
set -ga update-environment VSCODE_GIT_ASKPASS_NODE
set -ga update-environment VSCODE_GIT_ASKPASS_EXTRA_ARGS

# Shift+Enter, notifications and focus for Claude Code inside tmux
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g allow-passthrough on
set -g focus-events on

# --- Session persistence ----------------------------------------------
# tmux-resurrect saves/restores sessions, layouts, cwds and pane contents
# (prefix+C-s / prefix+C-r); tmux-continuum saves every 15 min and restores
# the last save when the first server starts after a reboot. Plugins come
# from .chezmoiexternal.toml. Keep this block last: continuum hooks its
# autosave into status-right when loaded. Running programs are not
# restarted (claude windows come back as a shell; run `claude -r` there).
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux
