# 1Password's SSH agent: which keys it offers. Without this file only Personal/Private; with it,
# only what is listed. The git signing key (gpg.ssh, ~/.gitconfig) lives in vault homelab since
# 2026-11-13, so it is named alone - the whole vault would offer more keys than sshd's MaxAuthTries.
[[ssh-keys]]
vault = "Private"

[[ssh-keys]]
item = "Github SSH key"
vault = "homelab"
